<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap/dist/css/jsvectormap.min.css" />
<script src="https://cdn.jsdelivr.net/npm/jsvectormap"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap/dist/maps/world.js"></script>

<title>Funil Monitor — Dashboard</title>

<style>
/* ===== SEU CSS MANTIDO INTACTO ===== */
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">⚡ Funil Monitor</div>
    <div class="sub">Dashboard privado de monitoramento</div>
    <input type="password" id="pwd-input" placeholder="Senha de acesso">
    <button onclick="doLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <header class="top-bar">
    <div class="brand">⚡ Funil<span>Monitor</span></div>
    <div class="top-bar-right">
      <span id="clock"></span>
      <div class="badge-live"><span class="dot"></span>AO VIVO</div>
      <button id="sound-btn" onclick="toggleSound()">🔕</button>
      <div id="ws-status"></div>
    </div>
  </header>

  <main class="grid">

    <!-- KPI -->
    <div class="card">
      <div class="card-label">Visitantes ao vivo</div>
      <div class="card-value" id="kpi-live">—</div>
    </div>

    <div class="card">
      <div class="card-label">Vendas hoje</div>
      <div class="card-value" id="kpi-sales">—</div>
    </div>

    <div class="card">
      <div class="card-label">Conversão</div>
      <div class="card-value" id="kpi-cr">—</div>
    </div>

    <div class="card">
      <div class="card-label">Top etapa</div>
      <div class="card-value" id="kpi-top-step">—</div>
    </div>

    <!-- FUNNEL -->
    <div class="card card-funnel">
      <div class="section-title">Funil</div>
      <div id="funnel-list"></div>
    </div>

    <!-- CHART -->
    <div class="card card-chart">
      <div class="section-title">Tráfego</div>
      <canvas id="chart-canvas"></canvas>
    </div>

    <!-- MAPA -->
    <div class="card">
      <div class="section-title">Mapa</div>
      <div id="world-map" style="width:100%; height:320px;"></div>
    </div>

    <!-- HEATMAP (CORRIGIDO: AGORA NO HTML) -->
    <div class="card">
      <div class="section-title">Heatmap Realtime</div>

      <canvas
        id="heatmap-canvas"
        style="width:100%; height:320px; background:#0e1320; border-radius:12px;"
      ></canvas>

    </div>

    <!-- PAÍSES -->
    <div class="card">
      <div class="section-title">Países</div>
      <div id="countries-list"></div>
    </div>

    <!-- VENDAS -->
    <div class="card">
      <div class="section-title">Vendas</div>
      <div id="sales-feed"></div>
    </div>

  </main>
</div>

<!-- TOAST -->
<div class="new-sale-flash" id="sale-toast">
  <div class="flash-label">Nova venda</div>
  <div class="flash-name" id="toast-name"></div>
  <div class="flash-amount" id="toast-amount"></div>
</div>

<script>

/* ================= AUTH ================= */

const AUTH_KEY = 'fm_auth';
let PASSWORD = '';

function doLogin() {
  const val = document.getElementById('pwd-input').value;

  fetch('/api/auth', {
    headers: { Authorization: 'Bearer ' + val }
  })
  .then(r => {
    if (r.ok) {
      PASSWORD = val;
      localStorage.setItem(AUTH_KEY, val);
      showApp();
    } else {
      document.getElementById('login-error').textContent = 'Senha inválida';
    }
  });
}

function checkSavedAuth() {
  const saved = localStorage.getItem(AUTH_KEY);
  if (saved) {
    PASSWORD = saved;
    showApp();
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initDashboard();
}

/* ================= CLOCK ================= */

setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('pt-BR');
}, 1000);

/* ================= HEATMAP (CORRIGIDO) ================= */

function renderHeatmap(points) {
  const canvas = document.getElementById('heatmap-canvas');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width;
  canvas.height = rect.height;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  points.forEach(p => {
    const x = (p.x / p.w) * canvas.width;
    const y = (p.y / p.h) * canvas.height;

    const g = ctx.createRadialGradient(x, y, 0, x, y, 50);
    g.addColorStop(0, 'rgba(255,0,80,.35)');
    g.addColorStop(1, 'rgba(255,0,80,0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, 50, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ================= WEB SOCKET (CORRIGIDO) ================= */

let ws;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';

  ws = new WebSocket(
    `${proto}://${location.host}?token=${encodeURIComponent(PASSWORD)}`
  );

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);

      if (msg.type === 'stats') {
        renderStats(msg.data);
      }

      if (msg.type === 'heatmap') {
        renderHeatmap(msg.data);
      }

    } catch (err) {
      console.error(err);
    }
  };
}

/* ================= STATS ================= */

function renderStats(data) {
  document.getElementById('kpi-live').textContent = data.live;
  document.getElementById('kpi-sales').textContent = data.totalSales;
  document.getElementById('kpi-cr').textContent = data.cr;
}

/* ================= INIT ================= */

function initDashboard() {
  fetch('/api/stats', {
    headers: { Authorization: 'Bearer ' + PASSWORD }
  })
  .then(r => r.json())
  .then(renderStats);

  connectWS();
}

checkSavedAuth();

</script>

</body>
</html>
